name: Render manifests

permissions:
  contents: write
  pull-requests: write

on:
  push:
    paths:
      - management/**
      - management/environments/**
      - apps/**
      - apps/environments/**
      - infra/**
      - infra/environments/**
      - .github/**

jobs:
  render-apps:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app:
          - media-stack
          - home-assistant

    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Add helm repos
        run: |
          set -euo pipefail
          for lock in $(find apps/ -name Chart.lock); do
            awk '/repository:/ {print $2}' "$lock" | sort -u | while read -r repo; do
              name=$(echo "$repo" | sed 's|https\?://||; s|/|-|g')
              helm repo add "$name" "$repo" || true
            done
          done
          helm repo update

      - name: Build deps
        run: |
          helm dependency build apps/${{ matrix.app }}

      - name: Render app
        run: |
          APP="${{ matrix.app }}"
          mkdir -p apps/rendered/prod/"$APP"

          helm template "$APP" apps/"$APP" -n "$APP" \
            > apps/rendered/prod/"$APP"/"$APP".yaml

      - name: Upload app artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.app }}
          path: apps/rendered/prod/${{ matrix.app }}

  render-infra:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        infra:
          - cert-manager
          - reloader

    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Add helm repos
        run: |
          set -euo pipefail
          for lock in $(find infra/ -name Chart.lock); do
            awk '/repository:/ {print $2}' "$lock" | sort -u | while read -r repo; do
              name=$(echo "$repo" | sed 's|https\?://||; s|/|-|g')
              helm repo add "$name" "$repo" || true
            done
          done
          helm repo update

      - name: Build deps
        run: |
          helm dependency build infra/${{ matrix.infra }}

      - name: Render infra
        run: |
          INFRA="${{ matrix.infra }}"
          mkdir -p infra/rendered/prod/"$INFRA"

          helm template "$INFRA" infra/"$INFRA" -n "$INFRA" \
            > infra/rendered/prod/"$INFRA"/"$INFRA".yaml

      - name: Upload infra artifacts
        uses: actions/upload-artifact@v4
        with:
          name: infra-${{ matrix.infra }}
          path: infra/rendered/prod/${{ matrix.infra }}

  render-pr:
    runs-on: ubuntu-latest
    needs:
      - render-apps
      - render-infra

    steps:
      - uses: actions/checkout@v4

      - name: Download app artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: app-*
          path: apps/rendered/prod
          merge-multiple: true

      - name: Download infra artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: infra-*
          path: infra/rendered/prod
          merge-multiple: true

      - name: Create render PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: render-manifest-pr
          title: "chore(render): update rendered manifests"
          commit-message: "chore(render): update rendered manifests"
          body: |
            Automated render output.

            - Apps rendered via matrix
            - Infra rendered via matrix
          delete-branch: true
          add-paths: |
            apps/rendered
            infra/rendered
